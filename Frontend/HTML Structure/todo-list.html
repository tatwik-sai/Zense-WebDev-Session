<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Todo List</title>
</head>
<body>
    <div class="container">
    <h1>My Todo List</h1>
    
    <h2>Add New Task</h2>
    <form>
        <input type="text" name="task" placeholder="Enter a new task...">
        <input type="submit" value="Add Task">
    </form>

    <hr>

    <h2>My Tasks</h2>
    <ul>
        <li>
            <input type="checkbox" id="task1">
            <label for="task1">Complete HTML project</label>
            <button>Edit</button>
            <button>Delete</button>
        </li>
        <li>
            <input type="checkbox" id="task2">
            <label for="task2">Learn web development</label>
            <button>Edit</button>
            <button>Delete</button>
        </li>
        <li>
            <input type="checkbox" id="task3">
            <label for="task3">Build a portfolio website</label>
            <button>Edit</button>
            <button>Delete</button>
        </li>
        <li>
            <input type="checkbox" id="task4">
            <label for="task4">Practice coding daily</label>
            <button>Edit</button>
            <button>Delete</button>
        </li>
        <li>
            <input type="checkbox" id="task5">
            <label for="task5">Read documentation</label>
            <button>Edit</button>
            <button>Delete</button>
        </li>
    </ul>

    <hr>
    </div>
</body>
</html>
